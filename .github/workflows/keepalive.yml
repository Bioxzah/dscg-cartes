name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity. Twice a week leaves a margin.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the public ping function
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" || { echo "VITE_SUPABASE_URL is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
